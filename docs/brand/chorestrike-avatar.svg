<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ChoreStrike repository avatar: CS monogram with a friendly broom mascot.
       Brand rules: docs/standards/guidelines/design.md section 4. -->
  <title>ChoreStrike</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18365C"/>
      <stop offset="1" stop-color="#0C1B30"/>
