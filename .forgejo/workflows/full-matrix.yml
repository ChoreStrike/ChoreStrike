# ChoreStrike E2E Full-Matrix Workflow (CS-PLAN-051 D4)
#
# Scheduled, NON-blocking companion to release-gate.yml's chromium-shaped E2E
# gate: re-runs the whole Playwright browser matrix (chromium, firefox,
# webkit + the chromium-serial-db / chromium-scheduling-owner projects) with
# `--retries=0` so "full matrix green" stays a verifiable state between
# manual runs. Failures here never block releases — they surface regressions
# early (report artifact below).
#
# The Docker bring-up + seed steps are copied verbatim from
# `.forgejo/workflows/release-gate.yml` (e2e job). Extracting a shared
# composite action is deferred until a third consumer exists.
#
# Runbook: docs/engineering/testing.md ("Full-matrix verification").

name: e2e-full-matrix

on:
  schedule:
    # Weekly, Mondays 04:00 UTC.
    - cron: '0 4 * * 1'
  workflow_dispatch:

env:
  NEXTCLOUD_TEST_ENV: "true"

jobs:
  e2e-full-matrix:
    name: E2E full matrix (--retries=0, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install JS dependencies
        run: |
          test "$(node --version)" = "v20.19.0"
          test "$(npm --version)" = "10.8.2"
          npm ci --engine-strict --legacy-peer-deps=false

      - name: Install Playwright browsers (chromium, firefox, webkit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Bring up Docker test env (NC 31 + app + family seed)
        run: |
          TEST_DB_PROFILE=family docker compose -f docker/compose.test.yml up -d --build
          # Wait for Nextcloud to report installed + healthy.
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Nextcloud failed to start within 300s"
              exit 1
            fi
            echo "Waiting for Nextcloud... ($i/60)"
            sleep 5
          done
          # Seed via the authenticated occ path (canonical, CS-PLAN-019).
          docker compose -f docker/compose.test.yml exec -T nextcloud-test \
            su -s /bin/bash www-data -c \
            "cd /var/www/html && php occ chorestrike:test-data:seed --profile=family"

      - name: Run Playwright full matrix (non-blocking)
        run: |
          npx playwright test --retries=0 --reporter=list,html
        env:
          NEXTCLOUD_URL: http://localhost:8080
          TEST_DB_PROFILE: family
          NEXTCLOUD_TEST_MODE: "true"
          CI: "true"
          # The CLI --reporter flag overrides the config's html options, so
          # the output folder must be pinned via env (CS-PLAN-069 WP4).
          PLAYWRIGHT_HTML_OUTPUT_DIR: build/playwright-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-matrix
          path: |
            build/test-results/
            build/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down Docker test env
        if: always()
        run: docker compose -f docker/compose.test.yml down
