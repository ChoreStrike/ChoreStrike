# ChoreStrike Release-Gate CI Workflow
#
# Authoritative quality gate. Runs on every push and pull_request.
# Fails the run on any non-zero **blocking** command:
#   - `npm run lint`        (ESLint, 0 errors required)
#   - `npm run stylelint`   (Stylelint, 0 errors required — CS-026)
#   - `npm test`            (Jest)
#   - `npm run build`       (Webpack production build)
#   - `npm run docs:encoding` (docs encoding gate — CS-PLAN-050, TECH-DOCS-001)
#   - `composer validate`   (composer.json sanity)
#   - `composer cs:check`   (PHP coding standard, 0 diff — CS-026)
#   - PHPUnit unit          (via Docker)
#   - PHPUnit integration   (via Docker)
#   - npm run test:e2e:gate (canonical sequential browser gate, via Docker —
#     blocking, CS-PLAN-020 + CS-PLAN-068 D1)
#
# Stylelint emits ~26 `use-logical` *warnings* (deferred RTL sweep → backlog
# TECH-LINT-004); warnings do not fail the gate (no `--max-warnings` set).
#
# This workflow is the single source of truth for gate commands. If a runner
# is not available yet, the commands below are the canonical local gate.

name: release-gate

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  NEXTCLOUD_TEST_ENV: "true"

jobs:
  # ---------- Frontend gate ----------
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint (blocking)
        run: npm run lint

      - name: Jest (blocking)
        run: npm test -- --ci

      - name: Webpack build (blocking)
        run: npm run build

      - name: Stylelint (blocking, CS-026)
        run: npm run stylelint

      - name: Docs encoding gate (blocking, CS-PLAN-050)
        run: npm run docs:encoding

      - name: Localization and browser-runner contracts (blocking)
        run: |
          npm run l10n:check-keys
          node scripts/run-e2e-gate.js --self-test
          npm run backlog:check

  # ---------- Composer sanity + PHP CS ----------
  composer:
    name: Composer validate + PHP CS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer
        run: |
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --quiet --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"

      - name: Validate composer.json (blocking)
        run: composer validate --strict --no-check-publish

      - name: Install dependencies (for php-cs-fixer)
        run: composer install --no-interaction --prefer-dist

      - name: PHP coding standard (blocking, CS-026)
        run: composer cs:check

  # ---------- Backend unit tests (Docker) ----------
  phpunit-unit:
    name: PHPUnit Unit (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t chorestrike-test:ci .

      - name: Install composer dependencies (cached)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            -w /var/www/html/custom_apps/chorestrike \
            chorestrike-test:ci \
            composer install --no-interaction --prefer-dist

      - name: Run PHPUnit unit (blocking)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            -e NEXTCLOUD_TEST_ENV=true \
            -w /var/www/html/custom_apps/chorestrike \
            chorestrike-test:ci \
            vendor/bin/phpunit --configuration phpunit.unit.xml

  # ---------- Backend integration tests (Docker) ----------
  phpunit-integration:
    name: PHPUnit Integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t chorestrike-test:ci .

      - name: Run PHPUnit integration (blocking)
        run: |
          TEST_DB_PROFILE=family docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 600
          docker compose -f docker-compose.test.yml exec -T nextcloud-test \
            vendor/bin/phpunit --configuration phpunit.integration.xml --fail-on-skipped

      - name: Tear down integration environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ---------- E2E gate (canonical sequential runner, blocking) ----------
  # CS-PLAN-068 (D1): the browser gate is the canonical sequential runner
  # `npm run test:e2e:gate` — it verifies the required-spec manifest by
  # discovery, then runs chromium, chromium-serial-db and
  # chromium-scheduling-owner SEQUENTIALLY with workers=1, retries=0 and
  # forbid-only against one disposable database, and fails on any
  # skipped/failed/flaky required scenario. Folding the full browser
  # matrix (firefox/webkit) is a documented follow-up once the chromium
  # gate proves stable in CI; until then, `full-matrix.yml` covers all
  # browser projects weekly on a scheduled, non-blocking basis
  # (CS-PLAN-051 D4).
  e2e:
    name: E2E (canonical gate)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Build application browser assets
        run: npm run build

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: Bring up Docker test env (NC 31 + app + family seed)
        run: |
          TEST_DB_PROFILE=family docker compose -f docker-compose.test.yml up -d --build
          # Wait for Nextcloud to report installed + healthy.
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Nextcloud failed to start within 300s"
              exit 1
            fi
            echo "Waiting for Nextcloud... ($i/60)"
            sleep 5
          done
          # Seed via the authenticated occ path (canonical, CS-PLAN-019).
          docker compose -f docker-compose.test.yml exec -T nextcloud-test \
            su -s /bin/bash www-data -c \
            "cd /var/www/html && php occ chorestrike:test-data:seed --profile=family"
          # Deterministic gate: disable the AJAX job scheduler — under AJAX
          # cron, background jobs execute INLINE with page loads and cause
          # periodic slow windows that flake the browser pools. The gate
          # never depends on scheduled jobs (time-travel specs trigger jobs
          # explicitly via occ chorestrike:trigger-jobs).
          docker compose -f docker-compose.test.yml exec -T nextcloud-test \
            su -s /bin/bash www-data -c \
            "cd /var/www/html && php occ background:cron"

      - name: Run the canonical E2E gate (blocking)
        run: npm run test:e2e:gate
        env:
          NEXTCLOUD_URL: http://localhost:8080
          TEST_DB_PROFILE: family
          NEXTCLOUD_TEST_MODE: "true"
          CI: "true"

      - name: Upload sanitized Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-gate
          path: |
            build/e2e-gate/run-*/summary-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down Docker test env
        if: always()
        run: docker compose -f docker-compose.test.yml down

  # ---------- Coverage artifacts (non-blocking, CS-PLAN-022 Phase 1) ----------
  coverage:
    name: Coverage (artifacts, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS dependencies
        run: npm ci

      - name: Jest coverage
        run: npm run test:coverage -- --ci

      - name: Build test image
        run: docker build -f docker/Dockerfile.test -t chorestrike-test:ci .

      - name: Install composer dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            -w /var/www/html/custom_apps/chorestrike \
            chorestrike-test:ci \
            composer install --no-interaction --prefer-dist

      - name: PHPUnit coverage (PCOV)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            -e NEXTCLOUD_TEST_ENV=true \
            -w /var/www/html/custom_apps/chorestrike \
            chorestrike-test:ci \
            composer test:coverage

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: build/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ---------- Summary ----------
  summary:
    name: Gate Summary
    runs-on: ubuntu-latest
    needs: [frontend, composer, phpunit-unit, phpunit-integration, e2e]
    if: always()
    steps:
      - name: Check results
        run: |
          {
            echo "## ChoreStrike Release Gate"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Frontend (lint + stylelint + test + build) | ${{ needs.frontend.result }} |"
            echo "| Composer validate + PHP CS                 | ${{ needs.composer.result }} |"
            echo "| PHPUnit Unit (Docker)          | ${{ needs.phpunit-unit.result }} |"
            echo "| PHPUnit Integration (Docker)   | ${{ needs.phpunit-integration.result }} |"
            echo "| E2E (chromium, Docker)         | ${{ needs.e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any blocking job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more blocking gate jobs failed." >&2
          exit 1
