# CS-PLAN-083 WP3: wired package smoke lane. One command (scripts/run-package-smoke.js)
# drives build-package → environment up → owner-smoke setup → verify (six cases)
# → evidence record → teardown. Never invoke this file directly without the
# runner: it expects PKG_IMAGE (frozen runtime image ID), PKG_EXTRACT_DIR
# (hash-verified extracted archive, mounted read-only) and a unique owned
# `-p cs082-*` project per run. Both test markers are false here; the package
# validator (scripts/run-package-smoke.js) enforces this boundary separately
# from scripts/test-target.js's true-marker requirements.
services:
  db-pgsql:
    labels:
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}
    image: ${PKG_PGSQL_IMAGE:-postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873}
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      # Same owned-volume layout as compose.test.yml: data lives in the
      # named volume mounted at the PostgreSQL root.
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - db:/var/lib/postgresql
    networks:
      - package-smoke
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nextcloud", "-d", "nextcloud"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nextcloud-pgsql:
    image: ${PKG_IMAGE:?Set PKG_IMAGE to the frozen runtime image ID}
    # Compose derives the container name <project>-nextcloud-pgsql-1.
    depends_on:
      db-pgsql:
        condition: service_healthy
    ports:
      # Ephemeral numeric IPv4 loopback port; the runner discovers the actual
      # binding via inspection and never guesses a port.
      - "127.0.0.1::80"
    volumes:
      # The same extracted, manifest-verified archive bytes both runtime rows
      # consume — never a staging directory that could differ from the archive.
      - "${PKG_EXTRACT_DIR:?Set PKG_EXTRACT_DIR to the hash-verified extraction}:/var/www/html/custom_apps/chorestrike:ro"
      - ./package-smoke-entrypoint.sh:/package-smoke-entrypoint.sh:ro
      - config:/var/www/html/config
      - data:/var/www/html/data
    working_dir: /var/www/html/custom_apps/chorestrike
    environment:
      - NEXTCLOUD_TEST_ENV=false
      - NEXTCLOUD_TEST_MODE=false
      - DB_HOST=db-pgsql
      - DB_NAME=nextcloud
      - DB_USER=nextcloud
      - DB_PASS=nextcloud
      - DB_PORT=5432
      - TEST_HTTP_URL=http://127.0.0.1
    labels:
      org.chorestrike.package-smoke: "true"
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}
    networks:
      - package-smoke
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/chorestrike-ready && curl -fsS http://localhost:80/status.php | grep -q '\"installed\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    command: ["bash", "/package-smoke-entrypoint.sh"]

networks:
  package-smoke:
    driver: bridge
    labels:
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}

volumes:
  db:
    labels:
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}
  config:
    labels:
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}
  data:
    labels:
      org.chorestrike.package-smoke-run: ${PKG_RUN_TOKEN:?Set the unique run token}
