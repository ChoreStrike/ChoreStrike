# Nextcloud front-controller vhost for the ChoreStrike test environment.
#
# Loaded from conf-enabled (before sites-enabled), so it replaces the stock
# 000-default vhost. The rewrite must live at vhost level: Nextcloud's own
# .htaccess starts a per-directory rewrite engine (without a catch-all rule)
# that would replace any <Directory> rewrite rules. Without this front
# controller, /apps/... URLs fall through to the 404 ErrorDocument and
# non-GET API requests are silently turned into GETs.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{REQUEST_URI} !\.php(?:/|$)
        RewriteCond %{REQUEST_URI} !^/\.well-known/
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
        RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
        RewriteCond %{REQUEST_URI} ^(/.*)$
        RewriteRule ^ /index.php%1 [PT,L]
    </IfModule>

    <Directory /var/www/html>
        Require all granted
        AllowOverride All
        Options FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
