# Read-only discovery, never qualification or deployment.
#
# NOTE (CS-PLAN-085 D-085-04): this is the one Docker-free scheduled workflow,
# so it keeps running automatically (weekly) alongside `checks.yml`. Drift it
# reports is promoted through a reviewed inventory update and requalification,
# never by deploying to an unlisted runtime (project-rules.md, Runtime
# Currency).
name: runtime-check

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  stable-drift:
    name: Weekly / Pre-Release Runtime Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frozen inventory
        uses: actions/checkout@v7
      - name: Setup supported Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
      - name: Validate frozen inventory offline
        run: npm run test:runtime:validate
      - name: Check official stable and frozen artifact drift
        run: npm run test:runtime:check
