# NOTE (CS-PLAN-085 D-085-04): this workflow is MANUAL
# (`workflow_dispatch`). Its Docker/browser jobs are far too slow and, because
# of the intermittent transport closures tracked as TECH-TRANSPORT-001, too
# flaky to gate every push. The cheap checks run automatically in `checks.yml`,
# and the binding quality gate remains the LOCAL Docker run documented in
# docs/engineering/testing.md. Run this from the Actions tab before a release.
#
# ChoreStrike profile/browser smoke workflow (GitHub Actions)
# Runs tests with different database profiles and browsers
#
# CS-PLAN-015b (D-CI): pinned Nextcloud image, added the app mount into the
# Nextcloud service, and included the chromium-serial-db project in the E2E
# invocation. The branch triggers it carried were replaced by manual dispatch
# with the GitHub migration (CS-PLAN-085 D-085-04).

name: Test

on:
  workflow_dispatch:

jobs:
  # Backend PHP Unit Tests
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # composer.json pins ~8.4.0 (CS-PLAN-082 promoted baseline).
        php: ['8.4']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build frozen test runtime
        run: docker build -f docker/Dockerfile.test -t chorestrike-test:ci .

      - name: Install dependencies
        run: |
          docker run --rm -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            chorestrike-test:ci composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: |
          docker run --rm -v "${{ github.workspace }}:/var/www/html/custom_apps/chorestrike" \
            -e NEXTCLOUD_TEST_ENV=true chorestrike-test:ci \
            vendor/bin/phpunit --configuration phpunit.unit.xml --fail-on-skipped --do-not-cache-result
        env:
          NEXTCLOUD_TEST_MODE: true

  # E2E Tests with Matrix Strategy
  # Profile/browser smoke on the same frozen runtime as release-gate.yml.
  # The upstream distribution image is not equivalent: its PHP may differ.
  e2e:
    name: E2E (${{ matrix.profile }} / ${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: phpunit
    env:
      CI: 'true'
      NEXTCLOUD_CONTAINER: chorestrike-test
      NEXTCLOUD_URL: http://localhost:8080
    strategy:
      fail-fast: false
      matrix:
        profile: [empty, minimal, family]
        browser: [chromium, firefox]
        exclude:
          # Skip firefox for empty profile to save CI time
          - profile: empty
            browser: firefox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: |
          test "$(node --version)" = "v20.19.0"
          test "$(npm --version)" = "10.8.2"
          npm ci --engine-strict --legacy-peer-deps=false

      - name: Build application browser assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Provision frozen test runtime
        run: |
          # All auth identities are required; per-test fixtures select matrix.profile.
          TEST_DB_PROFILE=family docker compose -f docker/compose.test.yml up -d --build --wait --wait-timeout 900
          npm run test:runtime:canonical

      - name: Run Playwright tests
        run: |
          npx playwright test --project=${{ matrix.browser }} --retries=0 --reporter=./scripts/playwright-summary-reporter.js
        env:
          NEXTCLOUD_URL: http://localhost:8080
          TEST_DB_PROFILE: ${{ matrix.profile }}
          NEXTCLOUD_TEST_MODE: true
          PLAYWRIGHT_SUMMARY_NAME: ${{ matrix.browser }}

      - name: Run Playwright serial-db tests (chromium only)
        if: matrix.browser == 'chromium'
        run: |
          npx playwright test --project=chromium-serial-db --retries=0 --reporter=./scripts/playwright-summary-reporter.js
        env:
          NEXTCLOUD_URL: http://localhost:8080
          TEST_DB_PROFILE: ${{ matrix.profile }}
          NEXTCLOUD_TEST_MODE: true
          PLAYWRIGHT_SUMMARY_NAME: chromium-serial-db

      - name: Upload sanitized test summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ matrix.profile }}-${{ matrix.browser }}
          path: |
            build/e2e-summary/*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down owned test environment
        if: always()
        run: docker compose -f docker/compose.test.yml down -v

  # Docker Build Test
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: phpunit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build -f docker/Dockerfile.test -t chorestrike-test:ci .

      - name: Build production image
        run: |
          docker build -f docker/Dockerfile -t chorestrike:ci .

  # Summary job
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [phpunit, e2e]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| PHPUnit | ${{ needs.phpunit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure')
        run: exit 1
