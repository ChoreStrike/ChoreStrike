# NOTE (CS-PLAN-085 D-085-04): this workflow is MANUAL
# (`workflow_dispatch`). Its Docker/browser jobs are far too slow and, because
# of the intermittent transport closures tracked as TECH-TRANSPORT-001, too
# flaky to gate every push. The cheap checks run automatically in `checks.yml`,
# and the binding quality gate remains the LOCAL Docker run documented in
# docs/engineering/testing.md. Run this from the Actions tab before a release.
#
# ChoreStrike E2E Full-Matrix Workflow (CS-PLAN-051 D4)
#
# NON-blocking companion to release-gate.yml's chromium-shaped E2E gate:
# re-runs the whole Playwright browser matrix (chromium, firefox, webkit + the
# chromium-serial-db / chromium-scheduling-owner projects) with `--retries=0`
# so "full matrix green" stays a verifiable state. Failures here never block
# releases — they surface regressions early (report artifact below).
#
# The weekly schedule it carried on the previous forge was dropped with the
# GitHub migration (CS-PLAN-085 D-085-04): a two-hour browser matrix on a
# timer earns nothing while the local gate is the binding one. Dispatch it
# when the browser surface changed.
#
# The Docker bring-up + seed steps are copied verbatim from
# `.github/workflows/release-gate.yml` (e2e job). Extracting a shared
# composite action is deferred until a third consumer exists.
#
# Runbook: docs/engineering/testing.md ("Full-matrix verification").

name: e2e-full-matrix

on:
  workflow_dispatch:

env:
  NEXTCLOUD_TEST_ENV: "true"

jobs:
  e2e-full-matrix:
    name: E2E full matrix (--retries=0, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.14.0'
          cache: 'npm'

      - name: Install JS dependencies
        run: |
          test "$(node --version)" = "v24.14.0"
          test "$(npm --version)" = "11.9.0"
          npm ci --engine-strict --legacy-peer-deps=false

      - name: Build application browser assets
        run: npm run build

      - name: Install Playwright browsers (chromium, firefox, webkit)
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Bring up Docker test env (NC 35.0.2 / PHP 8.4 / PostgreSQL 18.6 + app + family seed)
        run: |
          TEST_DB_PROFILE=family docker compose -f docker/compose.test.yml up -d --build --wait --wait-timeout 900
          npm run test:runtime:canonical
          # Wait for Nextcloud to report installed + healthy.
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/status.php | grep -q '"installed":true'; then
              echo "Nextcloud is ready."
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Nextcloud failed to start within 300s"
              exit 1
            fi
            echo "Waiting for Nextcloud... ($i/60)"
            sleep 5
          done
          # Seed via the authenticated occ path (canonical, CS-PLAN-019).
          docker compose -f docker/compose.test.yml exec -T nextcloud-test \
            su -s /bin/bash www-data -c \
            "cd /var/www/html && php occ chorestrike:test-data:seed --profile=family"

      - name: Run Playwright full matrix (non-blocking)
        run: |
          npx playwright test --retries=0 --reporter=./scripts/playwright-summary-reporter.js
        env:
          NEXTCLOUD_URL: http://localhost:8080
          TEST_DB_PROFILE: family
          NEXTCLOUD_TEST_MODE: "true"
          CI: "true"
          PLAYWRIGHT_SUMMARY_NAME: full-matrix

      - name: Upload sanitized Playwright summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-matrix
          path: |
            build/e2e-summary/*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Tear down Docker test env
        if: always()
        run: docker compose -f docker/compose.test.yml down
