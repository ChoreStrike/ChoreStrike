# Dependency updates for a single-maintainer project: monthly and grouped, so
# review effort stays bounded. Security advisories are delivered separately by
# GitHub and are not throttled by this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      composer-all:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ["*"]
